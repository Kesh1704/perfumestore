<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Cart</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header>
    <h1>Your Cart 🛒</h1>
    <nav><a href="index.html">Back to Shop</a></nav>
  </header>

  <main id="cart-container"></main>

  <script>
    function loadCart() {
      const cart = JSON.parse(localStorage.getItem('cart')) || [];
      const container = document.getElementById('cart-container');
      container.innerHTML = '';

      if (cart.length === 0) {
        container.innerHTML = '<p>Your cart is empty.</p>';
        return;
      }

      let total = 0;
      cart.forEach(item => {
        const itemTotal = item.price * item.qty;
        total += itemTotal;
        container.innerHTML += `
          <div>
            <h3>${item.name}</h3>
            <p>Quantity: ${item.qty}</p>
            <p>Price: $${item.price} | Total: $${itemTotal}</p>
          </div><hr/>
        `;
      });

      container.innerHTML += `<h2>Total: $${total}</h2><button onclick="checkout()">Checkout</button>`;
    }

    function checkout() {
      localStorage.removeItem('cart');
      alert("Thank you for your purchase!");
      location.href = 'index.html';
    }

    loadCart();
  </script>
</body>
</html>
